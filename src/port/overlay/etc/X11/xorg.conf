# Mainline DRM (mediatek-drm, no GPU driver yet): modesetting without acceleration.
# Inputs (silead touchscreen, PMIC keys) are hotplugged by udev + libinput.
Section "Device"
	Identifier "drm"
	Driver "modesetting"
	Option "kmsdev" "/dev/dri/card0"
	Option "AccelMethod" "none"
	Option "ShadowFB" "true"
EndSection
Section "Screen"
	Identifier "s"
	Device "drm"
EndSection
