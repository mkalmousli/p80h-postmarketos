Section "ServerFlags"
  Option "AutoAddDevices" "false"
  Option "AutoEnableDevices" "false"
EndSection
Section "Device"
  Identifier "fb"
  Driver "fbdev"
  Option "fbdev" "/dev/fb0"
EndSection
Section "Screen"
  Identifier "s"
  Device "fb"
EndSection
Section "InputDevice"
  Identifier "touch"
  Driver "evdev"
  Option "Device" "/dev/input/event3"
EndSection
Section "InputDevice"
  Identifier "keys"
  Driver "evdev"
  Option "Device" "/dev/input/event1"
EndSection
Section "ServerLayout"
  Identifier "l"
  Screen "s"
  InputDevice "touch" "CorePointer"
  InputDevice "keys" "CoreKeyboard"
EndSection
