Section "ServerFlags"
	Option "AutoAddDevices" "false"
	Option "AutoEnableDevices" "false"
	Option "DontVTSwitch" "true"
EndSection
Section "Device"
	Identifier "fb"
	Driver "fbdev"
	Option "fbdev" "/dev/fb0"
EndSection
Section "Screen"
	Identifier "s"
	Device "fb"
EndSection
Section "InputDevice"
	Identifier "touch"
	Driver "libinput"
	Option "Device" "/dev/input/event0"
EndSection
Section "ServerLayout"
	Identifier "l"
	Screen "s"
	InputDevice "touch" "CorePointer"
EndSection
