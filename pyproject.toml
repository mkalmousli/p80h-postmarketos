[project]
name = "p80h"
version = "0.1.0"
description = "USB control tool for the Teclast P80h (MT8163): state, shell, reboot, input, BROM/fastboot"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
p80h = "p80h.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/p80h"]
